<!DOCTYPE html>
<html x-data="darkMode" lang="en" :class="{ 'dark' : darkMode }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-5.0.2-dist/bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <title>Document</title>
</head>

<body class="dark-bg-body-dark">
    <!-- switch-darkmode -->
    <div class="d-flex align-items-center justify-content-start p-4">
        <i class="bi bi-moon-stars-fill fs-5 ms-2 lh-0 m-2 dark-text-white"></i>
        <div class="form-check form-switch">
            <input x-model="darkMode" class="form-check-input darkmode-switch" type="checkbox" role="switch"
                id="flexSwitchCheckDefault">
        </div>
        <i class="bi bi-brightness-high-fill fs-4 me-2 lh-0 m-2 dark-text-white"></i>
    </div>
    <!-- header -->
    <header class="header text-gray dark-text-white">
        <div class="container">
            <div class="row text-center">
                <h2 class="fw-bold mb-4"><span class="sayeh">Sayeh Restaurant</span> <span id="text"></span></h2>
                <p class="lh-lg">IT Is luxuary Restaurant In Herat Afghanistan</p>
            </div>

            <div x-data="countdown" class="row countdown justify-content-center my-2">
                <div>
                    <h3 class="fw-bold" x-text="days"></h3>
                    <h5 class="mb-0 ">Day</h5>
                </div>
                <div>
                    <h3 class="fw-bold" x-text="hours"></h3>
                    <h5 class="mb-0 ">Hour</h5>
                </div>
                <div>
                    <h3 class="fw-bold" x-text="minutes"></h3>
                    <h5 class="mb-0 ">Minute</h5>
                </div>
                <div>
                    <h3 class="fw-bold" x-text="seconds"></h3>
                    <h5 class="mb-0 ">Second</h5>
                </div>
            </div>

            <div class="row text-center gy-2 justify-content-center text-center">
                <div class="col-12">
                    <h6 class="mb-3 mt-4">Sayeh Restaurant is a place where delicious foods talk to you.</h6>
                </div>
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control">
                        <button class="btn ser-btn" type="button">Book a Desk</button>
                    </div>
                </div>
                <div class="col-12 social-links mt-4">
                    <a href=""><i lh-0 class="bi bi-twitter"></i></a>
                    <a href=""><i lh-0 class="bi bi-facebook"></i></a>
                    <a href=""><i lh-0 class="bi bi-instagram"></i></a>
                    <a href=""><i lh-0 class="bi bi-linkedin"></i></a>
                </div>
            </div>
        </div>
    </header>

    <section class="contact">
        <div class="container my-5">
            <div class="row text-center justify-content-center">
                <h2 class="fw-bold">Contact</h2>
                <hr>
            </div>

            <div class="row gy-5">
                <div class="col-lg-5">
                    <div class="card">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-geo-alt me-3"></i>
                            <div>
                                <h5 class="fw-bold">Address:</h5>
                                <p class="mb-0">Herat Afghanistan,Bag Melet Street</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-center my-3">
                            <i class="bi bi-envelope me-3"></i>
                            <div>
                                <h5 class="fw-bold">Email:</h5>
                                <p class="mb-0">Sofieligali2006@gmail.com</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-center">
                            <i class="bi bi-phone me-3"></i>
                            <div>
                                <h5 class="fw-bold">Phone Number:</h5>
                                <p class="mb-0">+98 987 354 746</p>
                            </div>
                        </div>
                        <div id="map" class="mt-3" style="height: 250px;"></div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <form action="#" class="card h-100">
                        <div class="row gy-4">
                            <div class="col-md-6">
                                <label class="form-label">Name</label>
                                <input class="form-control" type="text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input class="form-control" type="email">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Subject</label>
                                <input class="form-control" type="email">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Massage</label>
                                <textarea class="form-control" rows="7"></textarea>
                            </div>
                            <div class="col-md-12 text-center">
                                <button class="btn ser-btn">Send massage</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>




    <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/ityped@1.0.3"></script>
    <script>
        const textElement = document.querySelector('#text');
        ityped.init(textElement, { strings: ['Luxuary, Modern, Elegant place...'] });

    </script>

    <script defer src="https://unpkg.com/alpinejs@3.3.4/dist/cdn.min.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('darkMode', () => ({
                darkMode: false,

                init() {

                    if (localStorage.theme === 'dark') {
                        this.darkMode = true
                    }
                    else {
                        this.darkMode = false
                    }

                    this.$watch('darkMode', (value) => {
                        if (value) {
                            localStorage.theme = 'dark';
                        }
                        else {
                            localStorage.theme = 'light';
                        }
                    })
                }

            })),
                Alpine.data('countdown', () => ({
                    days: '00',
                    hours: '00',
                    minutes: '00',
                    seconds: '00',

                    init() {
                        let endDate = new Date(2026, 4, 40, 23, 59, 59).getTime();

                        setInterval(() => {
                            let nowDate = new Date().getTime();
                            let time = endDate - nowDate;

                            if (time >= 0) {
                                this.days = this.format(Math.floor(time / (1000 * 60 * 60 * 24)));
                                this.hours = this.format(Math.floor((time % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
                                this.minutes = this.format(Math.floor((time % (1000 * 60 * 60)) / (1000 * 60)));
                                this.seconds = this.format(Math.floor((time % (1000 * 60)) / 1000));
                            }
                        }, 1000);
                    },

                    format(num) {
                        return num < 10 ? '0' + num : num;
                    }

                }))
        })
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@srexi/purecounterjs/dist/purecounter_vanilla.js"></script>

    <script>
        const map = L.map('map').setView([34.352865, 62.204029], 11);

        const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        L.marker([34.352865, 62.204029]).bindPopup("Sayeh.io").addTo(map).openPopup();
    </script>
</body>

</html>
